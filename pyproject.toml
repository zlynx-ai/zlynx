[project]
name = "zlynx"
version = "0.1.11"
description = "Zlynx is a lightweight, highly-customizable deep learning library built on top of JAX and Flax NNX"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shinapri"},
]
maintainers = [
    { name = "Shinapri" },
]

keywords = ["jax", "flax", "deep-learning", "machine-learning", "neural-networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=4.6.1",
    "flax>=0.12.5",
    "grain>=0.2.16",
    "jax>=0.9.2",
    "optax>=0.2.6",
    "orbax>=0.1.9",
    "safetensors>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "twine>=6.0.0",
    "build>=1.2.0",
]
cpu = []
tpu = [
    "jax[tpu]>=0.9.2",
]
cuda = [
    "jax[cuda]>=0.9.2",
]
cuda12 = [
    "jax[cuda12]>=0.9.2",
]
cuda13 = [
    "jax[cuda13]>=0.9.2",
]
cuda12-local = [
    "jax[cuda12-local]>=0.9.2",
]
cuda13-local = [
    "jax[cuda13-local]>=0.9.2",
]
# rocm7-local = [
#     "jax[rocm7-local]>=0.9.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
# ]

[project.urls]
Homepage = "https://github.com/zlynx-ai/zlynx"
Repository = "https://github.com/zlynx-ai/zlynx"
Issues = "https://github.com/zlynx-ai/zlynx/issues"
Documentation = "https://zlynx.vercel.app/"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "scikit-learn>=1.8.0",
]
